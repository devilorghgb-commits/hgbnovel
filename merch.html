
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>merch (>_<)  </title>
  <link rel="icon" type="image/png" href="./hgb_logo.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .merch {
      position: relative;
      flex-shrink: 0;
    }

    .merch img {
      display: block;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .instagram {
      position: absolute;
      left: 51.5%;
      top: 50.7%;
      width: 45.6%;
      height: 10.5%;
      cursor: pointer;
    }

    .instagram::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -5%;
      height: clamp(2px, 0.3vw, 6px);
      background: #fff;
      opacity: 0;
    }

    .instagram:hover::after,
    .instagram:focus-visible::after {
      opacity: 1;
    }

    .instagram:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 6px;
    }
  </style>
</head>
<body>
  <div class="merch" id="merch">
    <img
      id="banner"
      src="./merch_soon.png"
      alt="HGB — Merch soon"
      draggable="false"
    >

    <a
      class="instagram"
      href="https://www.instagram.com/hellsingglockbboyz/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Abrir Instagram @hellsingglockbboyz em nova guia"
    ></a>
  </div>

  <script>
    const banner = document.getElementById("banner");
    const merch = document.getElementById("merch");

    function ajustarImagem() {
      if (!banner.naturalWidth) return;

      const escala = Math.min(
        window.innerWidth / banner.naturalWidth,
        window.innerHeight / banner.naturalHeight
      );

      merch.style.width = `${banner.naturalWidth * escala}px`;
      merch.style.height = `${banner.naturalHeight * escala}px`;
    }

    banner.addEventListener("load", ajustarImagem);
    window.addEventListener("resize", ajustarImagem);
    ajustarImagem();

    document.addEventListener("contextmenu", event => {
      event.preventDefault();
    });
  </script>
</body>
</html>
